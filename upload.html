<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Upload PDF</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #14161a; color: #e6e8ec;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%; max-width: 460px;
    background: #1b1e24; border: 1px solid #2c313a; border-radius: 12px;
    padding: 26px;
  }
  h1 { margin: 0 0 4px; font-size: 19px; font-weight: 600; }
  .sub { margin: 0 0 22px; color: #9aa1ad; font-size: 13.5px; }
  label { display: block; font-size: 13px; color: #9aa1ad; margin-bottom: 6px; }
  input[type=password] {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1px solid #2c313a; background: #14161a; color: #e6e8ec;
    font-size: 14px;
  }
  input[type=password]:focus { outline: 2px solid #3b82f6; outline-offset: 1px; border-color: transparent; }
  .field { margin-bottom: 16px; }

  .drop {
    border: 1.5px dashed #39404b; border-radius: 10px;
    padding: 26px 16px; text-align: center; color: #9aa1ad;
    cursor: pointer; transition: border-color .15s, background-color .15s;
  }
  .drop:hover { border-color: #4b5361; }
  .drop.over { border-color: #3b82f6; background: rgba(59,130,246,.07); }
  .drop.has-file { border-style: solid; border-color: #3b82f6; color: #e6e8ec; }
  .drop strong { display: block; color: #e6e8ec; font-weight: 500; margin-bottom: 2px; }
  .drop .small { font-size: 12.5px; }

  button {
    width: 100%; padding: 11px 16px; margin-top: 20px;
    border: 0; border-radius: 8px; background: #3b82f6; color: #fff;
    font-size: 14.5px; font-weight: 500; cursor: pointer;
    transition: background-color .15s;
  }
  button:hover:not(:disabled) { background: #2f6fd8; }
  button:disabled { opacity: .45; cursor: default; }

  .status { margin-top: 16px; font-size: 13.5px; min-height: 20px; }
  .status.ok { color: #4ade80; }
  .status.err { color: #f87171; }

  .bar {
    height: 4px; border-radius: 2px; background: #2c313a;
    margin-top: 14px; overflow: hidden; display: none;
  }
  .bar.show { display: block; }
  .bar i { display: block; height: 100%; width: 0; background: #3b82f6; transition: width .15s; }

  a { color: #60a5fa; }
</style>
</head>
<body>
  <div class="card">
    <h1>Upload PDF</h1>
    <p class="sub">Replaces whatever is currently on the display page.</p>

    <div class="field">
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password" placeholder="Enter upload password" />
    </div>

    <div id="drop" class="drop" tabindex="0" role="button" aria-label="Choose a PDF">
      <strong id="dropTitle">Choose a PDF</strong>
      <span class="small" id="dropSub">or drag and drop it here</span>
    </div>
    <input id="file" type="file" accept="application/pdf,.pdf" hidden />

    <div class="bar" id="bar"><i id="barFill"></i></div>

    <button id="go" disabled>Upload and display</button>
    <div class="status" id="status"></div>
    <p class="sub" style="margin:18px 0 0"><a href="/">&larr; Go to display page</a></p>
  </div>

  <script>
    const pwEl = document.getElementById('pw');
    const dropEl = document.getElementById('drop');
    const dropTitle = document.getElementById('dropTitle');
    const dropSub = document.getElementById('dropSub');
    const fileEl = document.getElementById('file');
    const goEl = document.getElementById('go');
    const statusEl = document.getElementById('status');
    const barEl = document.getElementById('bar');
    const barFill = document.getElementById('barFill');

    let picked = null;

    function refresh() {
      goEl.disabled = !(picked && pwEl.value);
    }

    function setFile(f) {
      if (!f) return;
      const ok = f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
      if (!ok) { say('That file is not a PDF.', 'err'); return; }
      picked = f;
      dropEl.classList.add('has-file');
      dropTitle.textContent = f.name;
      dropSub.textContent = (f.size / 1024 / 1024).toFixed(2) + ' MB';
      say('');
      refresh();
    }

    function say(msg, cls) {
      statusEl.textContent = msg || '';
      statusEl.className = 'status' + (cls ? ' ' + cls : '');
    }

    dropEl.addEventListener('click', () => fileEl.click());
    dropEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileEl.click(); }
    });
    fileEl.addEventListener('change', () => setFile(fileEl.files[0]));

    ;['dragenter', 'dragover'].forEach((ev) =>
      dropEl.addEventListener(ev, (e) => { e.preventDefault(); dropEl.classList.add('over'); })
    );
    ;['dragleave', 'drop'].forEach((ev) =>
      dropEl.addEventListener(ev, (e) => { e.preventDefault(); dropEl.classList.remove('over'); })
    );
    dropEl.addEventListener('drop', (e) => {
      if (e.dataTransfer && e.dataTransfer.files.length) setFile(e.dataTransfer.files[0]);
    });

    pwEl.addEventListener('input', refresh);

    goEl.addEventListener('click', () => {
      if (!picked || !pwEl.value) return;

      const form = new FormData();
      form.append('file', picked, picked.name);

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload');
      xhr.setRequestHeader('X-Upload-Password', pwEl.value);

      goEl.disabled = true;
      say('Uploading…');
      barEl.classList.add('show');
      barFill.style.width = '0%';

      xhr.upload.addEventListener('progress', (e) => {
        if (e.lengthComputable) {
          barFill.style.width = Math.round((e.loaded / e.total) * 100) + '%';
        }
      });

      xhr.addEventListener('load', () => {
        let body = {};
        try { body = JSON.parse(xhr.responseText); } catch {}
        if (xhr.status === 200 && body.ok) {
          barFill.style.width = '100%';
          say('Uploaded. It is now live on the display page.', 'ok');
          goEl.disabled = false;
        } else {
          barEl.classList.remove('show');
          say(body.error || ('Upload failed (' + xhr.status + ')'), 'err');
          goEl.disabled = false;
        }
      });

      xhr.addEventListener('error', () => {
        barEl.classList.remove('show');
        say('Network error during upload.', 'err');
        goEl.disabled = false;
      });

      xhr.send(form);
    });

    refresh();
  </script>
</body>
</html>
